<!-- English-only Content layout. The build inserts the complete existing list. -->
<section class="toc toc--redesign" id="contents" aria-labelledby="contents-heading">
  <div class="container">
    <h2 class="contents-heading" id="contents-heading" data-i18n="contents.redesign.heading"></h2>
    <h3 class="contents-subtitle" data-i18n="contents.redesign.subtitle"></h3>
    <p class="contents-description" data-i18n="contents.redesign.description"></p>
    <details class="contents-details" id="contents-details">
      <summary class="contents-toggle">
        <span class="contents-toggle__label" data-i18n="contents.redesign.explore"></span>
        <span class="contents-toggle__count" data-i18n="contents.redesign.count"></span>
        <span class="contents-toggle__symbol contents-toggle__closed" aria-hidden="true">+</span>
        <span class="contents-toggle__symbol contents-toggle__open" aria-hidden="true">−</span>
      </summary>
      <div data-contents-list></div>
    </details>
  </div>
</section>

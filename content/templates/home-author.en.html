<!-- English-only Author layout. The build moves the original portrait and copy. -->
<section class="author author--redesign" id="author" aria-labelledby="author-heading">
  <div class="container">
    <h2 class="author-heading" id="author-heading" data-i18n="author.label"></h2>
    <h3 class="author-name" data-i18n="name.author"></h3>
    <div class="author-layout">
      <div data-author-photo></div>
      <div data-author-verse></div>
      <div class="author__bio">
        <div data-author-intro></div>
        <details class="author-details" id="author-details">
          <summary class="author-toggle">
            <span class="author-toggle__closed" data-i18n="author.redesign.readMore"></span>
            <span class="author-toggle__open" data-i18n="author.redesign.readLess"></span>
            <span class="author-toggle__closed author-toggle__symbol" aria-hidden="true">+</span>
            <span class="author-toggle__open author-toggle__symbol" aria-hidden="true">−</span>
          </summary>
          <div class="author-extended" data-author-extended></div>
        </details>
        <div class="author-links" data-author-links></div>
      </div>
    </div>
  </div>
</section>
